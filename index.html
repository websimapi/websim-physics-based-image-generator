<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Physics-Based Image Generator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="input-section">
      <input type="text" id="imagePrompt" placeholder="Enter image description...">
      <button onclick="window.app.generateImage()">Generate</button>
    </div>
    
    <div class="generation-chamber">
      <canvas id="physicsCanvas" width="800" height="600"></canvas>
      <div id="pixelContainer"></div>
    </div>

    <div class="controls">
      <button onclick="window.app.togglePhysics()">Toggle Physics</button>
      <div class="sliders">
        <label>Gravity: <input type="range" id="gravitySlider" min="0" max="2" step="0.1" value="0.5"></label>
        <label>Bounce: <input type="range" id="bounceSlider" min="0" max="1" step="0.1" value="0.7"></label>
        <label>Friction: <input type="range" id="frictionSlider" min="0" max="1" step="0.1" value="0.1"></label>
      </div>
    </div>
  </div>
  
  <script type="module" src="scripts/main.js"></script>

</body>
</html>
